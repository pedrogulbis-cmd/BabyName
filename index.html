<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baby Name">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Plus de 150 000 prénoms de bébé, fille et garçon : origine, signification, étymologie, tradition, fête et popularité.">
<title>Baby Name</title>
<script>
/* Manifeste construit ici même, comme dans CashFlow : adresses complètes
   calculées d'après l'emplacement réel de la page (GitHub Pages, sous-dossier…).
   Chrome installe alors l'app en plein écran depuis « Ajouter à l'écran
   d'accueil », sans dépendre du service de Google qui fabrique les WebAPK. */
(function(){
  try {
    var base = location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/, "");
    var man = {
      name: "Baby Name", short_name: "Baby Name",
      description: "Plus de 150 000 prénoms de bébé : origine, signification, tradition, fête et popularité.",
      lang: "fr", start_url: base, scope: base, id: base,
      display: "standalone", orientation: "portrait",
      background_color: "#f9f9f9", theme_color: "#ffffff",
      icons: [
        { src: base + "icons/icon-192.png", sizes: "192x192", type: "image/png", purpose: "any" },
        { src: base + "icons/icon-512.png", sizes: "512x512", type: "image/png", purpose: "any" },
        { src: base + "icons/icon-maskable-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" }
      ]
    };
    var l = document.createElement("link");
    l.rel = "manifest";
    l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: "application/manifest+json" }));
    document.head.appendChild(l);
  } catch(e){}
})();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Clair — reprise de CashFlow : papier blanc, encre noire, un seul accent,
     qui prend ici la couleur du choix fait sur le bébé. Lavande et rose
     viennent du logo. */
  --fond:#ffffff; --fond2:#fafafa; --carte:#ffffff;
  --trait:#e6e6e9; --trait2:#f1f1f4;
  --texte:#000000; --gris:#71717a; --gris2:#a1a1aa;
  --rose:#D6336C; --bleu:#2C3AE0; --violet:#7E68C9;
  --lavande:#AC9BD4; --rosepale:#EAA4BA; --or:#E0A21B;
  --acc:var(--rose); --accF:rgba(214,51,108,.08); --accB:rgba(214,51,108,.35); --surAcc:#ffffff;
  --peau:#F6D6C2; --peau2:#EFC3A8; --trait-visage:#3b2a24; --joue:#F29BB0;
  --voile:rgba(255,255,255,.88);
  --ombre:0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(0,0,0,.06);
  --ombre2:0 2px 6px rgba(0,0,0,.05), 0 18px 48px rgba(0,0,0,.10);
  --r:12px;
  --tab:calc(58px + env(safe-area-inset-bottom));
  --row:64px;
}
html[data-mode="M"]{--acc:var(--bleu);--accF:rgba(44,58,224,.08);--accB:rgba(44,58,224,.35)}
html[data-mode="T"]{--acc:var(--violet);--accF:rgba(126,104,201,.09);--accB:rgba(126,104,201,.35)}
html[data-theme="sombre"]{
  --fond:#0d0d10; --fond2:#141418; --carte:#141418;
  --trait:#26262d; --trait2:#1c1c22;
  --texte:#f6f6f7; --gris:#9a9aa4; --gris2:#6d6d78;
  --rose:#FF6B9A; --bleu:#7C8CFF; --violet:#B3A3F0; --or:#F5BE3F;
  --accF:rgba(255,107,154,.10); --accB:rgba(255,107,154,.35); --surAcc:#0d0d10;
  --peau:#E9C3AC; --peau2:#D9A98D; --trait-visage:#2a1d18;
  --voile:rgba(13,13,16,.88);
  --ombre:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.5);
  --ombre2:0 2px 6px rgba(0,0,0,.4), 0 18px 48px rgba(0,0,0,.6);
}
html[data-theme="sombre"][data-mode="M"]{--accF:rgba(124,140,255,.10);--accB:rgba(124,140,255,.35)}
html[data-theme="sombre"][data-mode="T"]{--accF:rgba(179,163,240,.10);--accB:rgba(179,163,240,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--fond);color:var(--texte);
  font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;transition:background .25s;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button[disabled]{opacity:.45;pointer-events:none}
a{color:var(--acc)}
h1,h2,h3{font-weight:600;margin:0;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.015em;white-space:nowrap}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.hide{display:none!important}
.drap{display:inline-block;width:18px;height:12px;border-radius:2.5px;object-fit:cover;vertical-align:-1px;
  box-shadow:0 0 0 1px rgba(0,0,0,.08);flex:0 0 auto;background:var(--trait2)}
.drap.g{width:24px;height:16px;border-radius:3px}
.etin{display:inline-block;width:18px;text-align:center;color:var(--gris2);font-size:12px}

/* ---------------- ossature ---------------- */
.wrap{max-width:640px;margin:0 auto;padding:0 18px calc(var(--tab) + 28px);position:relative;z-index:1}
header.top{position:sticky;top:0;z-index:30;background:var(--voile);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--trait);padding-top:env(safe-area-inset-top)}
.top-in{max-width:640px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;letter-spacing:-.03em}
.brand img{width:34px;height:auto;display:block}
.brand b{font-weight:600}
.brand b span{color:var(--rosepale)}
.brand b em{font-style:normal;color:var(--lavande)}
.top-sp{flex:1}
.ver{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--gris);
  border:1px solid var(--trait);border-radius:7px;padding:3px 7px;background:var(--fond2)}
@media(max-width:420px){.ver{display:none}}
.iconbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  border:1px solid var(--trait);color:var(--texte);background:var(--carte)}
.iconbtn:active{background:var(--fond2)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--voile);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--trait);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
  color:var(--gris);font-size:10.5px;letter-spacing:-.01em;border-top:2px solid transparent;margin-top:-1px}
.tab.on{color:var(--texte);border-top-color:var(--acc)}
.tab.on svg{color:var(--acc)}
.tab .pas{position:absolute;top:4px;left:calc(50% + 7px);min-width:16px;height:16px;border-radius:8px;
  background:var(--acc);color:var(--surAcc);font-size:9.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}

/* ---------------- le bébé, élément signature ---------------- */
.hero{padding:22px 0 16px;text-align:center;border-bottom:1px solid var(--trait)}
.scene{perspective:1000px;width:172px;height:172px;margin:4px auto 0;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;position:relative}
.scene:active{cursor:grabbing}
.prisme{position:absolute;inset:0}
.face{position:absolute;inset:0;border-radius:36px;display:grid;place-items:center;
  transform-origin:50% 50%;border:1px solid var(--trait);
  box-shadow:var(--ombre);overflow:hidden}
.face svg{width:84%;height:84%;display:block}
.face.f{background:radial-gradient(120% 90% at 50% 10%,rgba(214,51,108,.16),rgba(214,51,108,.04) 70%),var(--carte)}
.face.m{background:radial-gradient(120% 90% at 50% 10%,rgba(44,58,224,.15),rgba(44,58,224,.035) 70%),var(--carte)}
.face.t{background:radial-gradient(120% 90% at 50% 10%,rgba(126,104,201,.18),rgba(126,104,201,.04) 70%),var(--carte)}
.hero-lbl{font-size:13.5px;color:var(--gris);margin-top:16px}
.hero-val{font-size:clamp(34px,11vw,48px);font-weight:600;letter-spacing:-.045em;line-height:1.05;margin:4px 0 0;display:block}
.hero-val em{font-style:normal;color:var(--acc);transition:color .3s}
.hero-bar{height:3px;width:56px;background:var(--acc);border-radius:2px;margin:12px auto 0;transition:background .3s}
.seg3{display:inline-grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--trait);border-radius:11px;
  overflow:hidden;margin-top:16px;background:var(--carte)}
.seg3 button{padding:8px 16px;font-size:13.5px;color:var(--gris);border-right:1px solid var(--trait);display:flex;gap:6px;align-items:center;justify-content:center}
.seg3 button:last-child{border-right:0}
.seg3 button.on{background:var(--acc);color:var(--surAcc);font-weight:500}
.hint{font-size:11.5px;color:var(--gris2);margin-top:10px;font-family:"IBM Plex Mono",monospace}

/* ---------------- barre de recherche collante ---------------- */
.outils{position:sticky;z-index:20;background:var(--voile);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  margin:0 -18px;padding:10px 18px 8px;border-bottom:1px solid var(--trait)}
.rech{position:relative}
.rech svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gris2);pointer-events:none}
.rech input{width:100%;padding:11px 126px 11px 38px;border-radius:11px;border:1px solid var(--trait);
  background:var(--carte);color:var(--texte);font-size:15.5px;-webkit-appearance:none;appearance:none}
.rech input:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}
.rech input::-webkit-search-cancel-button{display:none}
.portee{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;border:1px solid var(--trait);border-radius:8px;overflow:hidden;background:var(--fond2)}
.portee button{font-size:11.5px;padding:5px 8px;color:var(--gris)}
.portee button.on{background:var(--acc);color:var(--surAcc)}
.rech .x{position:absolute;right:92px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:8px;
  display:grid;place-items:center;color:var(--gris)}
.lig-outils{display:flex;align-items:center;gap:7px;margin-top:9px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chips.wr{flex-wrap:wrap;overflow:visible}
.chip{white-space:nowrap;font-size:12.5px;padding:6px 11px;border-radius:999px;
  border:1px solid var(--trait);color:var(--gris);background:var(--carte);display:inline-flex;align-items:center;gap:6px}
.chip.on{color:var(--surAcc);background:var(--acc);border-color:var(--acc)}
.chip.on .drap{box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.chip.lien{color:var(--texte)}
.chip.lien:active{background:var(--fond2)}
.chip small{font-size:10.5px;opacity:.7;font-family:"IBM Plex Mono",monospace}
.filtre-btn{position:relative;flex:0 0 auto}
.filtre-btn i{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--acc);border:2px solid var(--fond)}
.compte{font-size:12px;color:var(--gris2);margin-top:7px;display:flex;justify-content:space-between;gap:10px}
.compte b{color:var(--texte);font-weight:500}

/* ---------------- liste virtuelle ---------------- */
.liste{position:relative}
.fen{position:absolute;left:0;right:0;top:0;will-change:transform}
.nrow{display:flex;align-items:center;gap:12px;height:var(--row);padding:0 2px;border-bottom:1px solid var(--trait2);cursor:pointer}
.nrow:active{background:var(--fond2)}
.av{width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:grid;place-items:center;
  font-size:15px;font-weight:600;background:var(--fond2);border:1px solid var(--trait2);color:var(--gris)}
.av.F{color:var(--rose);background:color-mix(in srgb,var(--rose) 9%,transparent);border-color:color-mix(in srgb,var(--rose) 18%,transparent)}
.av.M{color:var(--bleu);background:color-mix(in srgb,var(--bleu) 9%,transparent);border-color:color-mix(in srgb,var(--bleu) 18%,transparent)}
.av.X{color:var(--violet);background:color-mix(in srgb,var(--violet) 10%,transparent);border-color:color-mix(in srgb,var(--violet) 20%,transparent)}
.nmid{flex:1;min-width:0}
.nn{display:block;font-weight:500;font-size:15.5px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ns{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gris2);margin-top:1px;white-space:nowrap;overflow:hidden}
.ns span{overflow:hidden;text-overflow:ellipsis}
.nr{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--gris2);white-space:nowrap}
.coeur{width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:grid;place-items:center;color:var(--gris2)}
.coeur.l1{color:var(--acc)}
.coeur.l1 svg{fill:currentColor}
.coeur.l2{color:var(--or)}
.coeur.l2 svg{fill:currentColor}
.coeur:active{transform:scale(.88)}
.avec-rail .nrow{padding-right:26px}
.vide{padding:34px 4px;color:var(--gris);font-size:14px;text-align:center;border-bottom:1px solid var(--trait2)}
.vide b{display:block;color:var(--texte);font-weight:500;margin-bottom:5px;font-size:15px}

/* ---------------- index alphabétique ---------------- */
.rail{position:fixed;z-index:25;right:max(2px,calc((100vw - 640px) / 2 + 2px));width:24px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none;
  opacity:0;pointer-events:none;transition:opacity .25s}
.rail.on{opacity:1;pointer-events:auto}
.rail span{display:block;font-size:10px;font-weight:600;line-height:1;color:var(--gris2);
  transform-origin:right center;transition:transform .16s ease-out,color .16s;padding:0 5px 0 0;will-change:transform}
.rail span.pres{color:var(--gris)}
.rail span.act{color:var(--acc)}
.bulle{position:fixed;z-index:26;width:66px;height:66px;border-radius:20px;background:var(--acc);color:var(--surAcc);
  display:grid;place-items:center;font-size:34px;font-weight:600;letter-spacing:-.03em;box-shadow:var(--ombre);
  right:max(44px,calc((100vw - 640px) / 2 + 44px));opacity:0;transform:scale(.7);pointer-events:none;
  transition:opacity .18s,transform .18s}
.bulle.on{opacity:1;transform:none}

/* ---------------- fiche prénom (panneau) ---------------- */
#sheet:empty,#modal:empty{display:none}
.sheet[data-g="F"]{--acc:var(--rose)}.sheet[data-g="M"]{--acc:var(--bleu)}.sheet[data-g="X"]{--acc:var(--violet)}
.sheet{position:fixed;inset:0;z-index:51;background:var(--fond);overflow:auto;overscroll-behavior:contain;
  animation:mte .22s cubic-bezier(.22,.7,.3,1)}
@keyframes mte{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.sheet-in{max-width:640px;margin:0 auto;padding:0 18px calc(40px + env(safe-area-inset-bottom))}
.sheet-top{position:sticky;top:0;z-index:5;background:var(--voile);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--trait);
  padding:calc(env(safe-area-inset-top) + 9px) 18px 9px;display:flex;align-items:center;gap:10px}
.sheet-top .t{flex:1;font-weight:600;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  opacity:0;transition:opacity .2s}
.sheet-top .t.on{opacity:1}
.fiche-h{padding:26px 0 20px;border-bottom:1px solid var(--trait)}
.fiche-nom{font-size:clamp(44px,14vw,64px);font-weight:600;letter-spacing:-.05em;line-height:1;margin:10px 0 0;word-break:break-word}
.fiche-complet{font-size:15px;color:var(--gris);margin-top:8px}
.fiche-sens{font-size:19px;letter-spacing:-.02em;line-height:1.3;margin-top:14px;font-weight:500}
.fiche-sens::before{content:"« ";color:var(--acc)}
.fiche-sens::after{content:" »";color:var(--acc)}
.fiche-bar{height:3px;width:56px;background:var(--acc);border-radius:2px;margin:16px 0 0}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border:1px solid var(--trait);border-radius:7px;
  padding:2px 8px;color:var(--gris);background:var(--carte)}
.badge.F{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 30%,transparent)}
.badge.M{color:var(--bleu);border-color:color-mix(in srgb,var(--bleu) 30%,transparent)}
.badge.X{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 30%,transparent)}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 0}
.btns.grow>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 15px;border-radius:10px;border:1px solid var(--trait);background:var(--carte);
  font-size:14px;font-weight:500;letter-spacing:-.01em}
.btn:active{background:var(--fond2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--surAcc)}
.btn.pri svg{fill:currentColor}
.btn.gold{background:var(--or);border-color:var(--or);color:#fff}
.btn.gold svg{fill:currentColor}
.btn.dang{color:#B32424;border-color:rgba(179,36,36,.2)}
.btn.wide{width:100%}
.sect{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.sect h2{font-size:15px;font-weight:600}
.sect .cnt{font-size:12.5px;color:var(--gris2)}
.sect .sp{flex:1}
.grille{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--trait2)}
.cel{padding:12px 2px 12px 0;border-bottom:1px solid var(--trait2);min-width:0}
.cel:nth-child(2n){padding-left:14px;border-left:1px solid var(--trait2)}
.cel .l{font-size:12px;color:var(--gris)}
.cel .v{font-size:16px;font-weight:500;letter-spacing:-.015em;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.cel .d{font-size:11.5px;color:var(--gris2);margin-top:2px;font-family:"IBM Plex Mono",monospace}
.texte{font-size:15px;line-height:1.6;color:var(--texte);margin:0}
.texte + .texte{margin-top:10px}
.note{font-size:12.5px;color:var(--gris);line-height:1.5;margin-top:10px;padding:10px 12px;border-radius:10px;
  background:var(--fond2);border:1px solid var(--trait2)}
.note a{cursor:pointer;font-weight:500;text-decoration:none}
.genre-barre{display:flex;height:6px;border-radius:4px;overflow:hidden;margin-top:8px;background:var(--trait2)}
.genre-barre i{display:block;height:100%}
.chart{position:relative;margin-top:4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart .axe{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:var(--gris2)}
.chart .tip{position:absolute;top:-6px;transform:translateX(-50%);background:var(--texte);color:var(--fond);
  font-size:11.5px;padding:4px 8px;border-radius:7px;white-space:nowrap;pointer-events:none;font-family:"IBM Plex Mono",monospace;
  opacity:0;transition:opacity .12s}
.chart .tip.on{opacity:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--trait2);border-bottom:1px solid var(--trait2);margin-bottom:12px}
.kpi{padding:12px 0 11px;min-width:0}
.kpi + .kpi{border-left:1px solid var(--trait2);padding-left:12px}
.kpi .l{font-size:11.5px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:clamp(18px,5.4vw,24px);font-weight:600;letter-spacing:-.035em;margin-top:2px;white-space:nowrap}
.kpi .d{font-size:11px;color:var(--gris2);font-family:"IBM Plex Mono",monospace;margin-top:1px;white-space:nowrap}
.tend{font-family:"IBM Plex Mono",monospace;font-size:12px}

<body>

<script>
"use strict";
/* ============================================================
   Baby Name — prénoms de bébé, fille et garçon
   Une seule page, aucune dépendance. Les données (data/names.js)
   sont chargées à part ; goûts et réglages restent sur l'appareil.
   ============================================================ */
const VERSION = "2.0.0";
const DATA_V = "2";                 // à incrémenter quand data/names.js change
const JOURNAL = [
  { v:"2.0.0", d:"2026-09-25", t:"Découvrir, J'aime et coups de cœur", l:[
    "Nouvel onglet Découvrir : des cartes à balayer, à droite j'aime, à gauche non, vers le haut coup de cœur.",
    "Les propositions s'inspirent de tes goûts : racine, origine, sonorité, finale, époque, tradition.",
    "J'aime et coups de cœur sont distingués partout ; Ma liste les range à part.",
    "Mode duo : partage tes goûts par lien, ton ou ta partenaire voit vos prénoms en commun.",
    "Nom de famille dans les réglages : chaque prénom s'affiche en entier, avec les initiales.",
    "Filtre par tradition religieuse, drapeaux pour les origines.",
    "Environ 18 000 prénoms de plus avec une origine ou une formation expliquée, d'après le Wiktionnaire et l'analyse des prénoms.",
    "Le bébé reste centré quand il pivote. Nouveau logo et icônes pour l'écran d'accueil."
  ]},
  { v:"1.0.0", d:"2026-09-25", t:"Première version", l:[
    "Plus de 150 000 prénoms : naissances en France de 1900 à 2025 (INSEE), aux États-Unis depuis 1880, et usage dans une cinquantaine de pays.",
    "Origine, signification, étymologie et fête pour près de 2 000 prénoms racines, transmises à leurs variantes, graphies proches et prénoms composés.",
    "Le bébé de l'accueil pivote : fille, garçon ou les deux, et la liste suit.",
    "Index alphabétique sur le côté : la lettre en cours grossit à mesure qu'on défile."
  ]}
];

const $ = s => document.querySelector(s);

/* ---------------- installation comme application ----------------
   Chrome (Android, ordinateur) n'installe une vraie application que si la
   page a un manifeste valide et un service worker actif. Le service worker
   est donc enregistré tout de suite, et l'invitation d'installation de
   Chrome est gardée pour le bouton « Installer ». */
let invitation = null;
const estInstallee = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const estIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("service worker", e));
}
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  invitation = e;
  majInstall();
});
window.addEventListener("appinstalled", () => {
  invitation = null;
  majInstall();
  toast("Baby Name est installée sur ton appareil");
});
function majInstall(){
  const b = document.getElementById("btn-installer");
  if(b) b.classList.toggle("hide", !invitation || estInstallee());
  const bl = document.getElementById("bloc-install");
  if(bl) bl.innerHTML = blocInstall();
}
async function installer(){
  if(invitation){
    invitation.prompt();
    const r = await invitation.userChoice.catch(() => null);
    if(r && r.outcome === "accepted") invitation = null;
    majInstall();
    return;
  }
  allerVue("plus");
  setTimeout(() => { const b = document.getElementById("bloc-install"); if(b) b.scrollIntoView({ behavior:"smooth", block:"center" }); }, 60);
}
function blocInstall(){
  const txt = 'style="font-size:13px;color:var(--gris);line-height:1.6"';
  if(estInstallee()) return '<div ' + txt + '>✓ Tu utilises Baby Name en application.</div>';
  if(invitation) return '<div class="lig"><div class="l">Ajouter Baby Name à l\'écran d\'accueil<div class="d">Elle s\'ouvrira en plein écran, avec son icône, et fonctionnera hors ligne.</div></div><button class="btn pri" data-act="installer">Installer</button></div>';
  if(estIOS) return '<div ' + txt + '>Dans <b style="color:var(--texte)">Safari</b> : touche le bouton Partager en bas, puis « <b style="color:var(--texte)">Sur l\'écran d\'accueil</b> ». Sur iPhone, seul Safari sait installer une application web.</div>';
  return '<div ' + txt + '>Dans Chrome : menu <b style="color:var(--texte)">⋮</b> → « <b style="color:var(--texte)">Ajouter à l’écran d’accueil</b> » → <b style="color:var(--texte)">Installer</b> (pas « Créer un raccourci »). L’app s’ouvre ensuite en plein écran, sans barre d’adresse, comme CashFlow.</div>' +
    '<div class="btns"><button class="btn" data-act="diag-install">Vérifier l’installation</button></div><div id="diag" class="note hide"></div>';
}
async function diagnostic(){
  const d = document.getElementById("diag"); if(!d) return;
  const l = [];
  l.push((location.protocol === "https:" ? "✓" : "✗") + " page en HTTPS");
  try { const r = await fetch(document.querySelector('link[rel="manifest"]').href); const m = await r.json(); l.push("✓ manifeste prêt (" + (m.icons || []).length + " icônes, départ " + m.start_url + ")"); }
  catch(e){ l.push("✗ manifeste introuvable"); }
  for(const ic of ["icons/icon-192.png", "icons/icon-512.png", "sw.js"]){
    try { const r = await fetch(ic, { cache:"no-store" }); l.push((r.ok ? "✓ " : "✗ ") + ic); } catch(e){ l.push("✗ " + ic); }
  }
  if("serviceWorker" in navigator){
    const reg = await navigator.serviceWorker.getRegistration();
    l.push((reg && reg.active ? "✓" : "✗") + " service worker " + (reg ? (reg.active ? "actif" : "en cours d'installation") : "absent"));
    l.push((navigator.serviceWorker.controller ? "✓ page contrôlée" : "… page pas encore contrôlée : recharge la page"));
  } else l.push("✗ service worker non pris en charge par ce navigateur");
  l.push(invitation ? "✓ Chrome propose l'installation directe" : "→ passe par ⋮ puis « Ajouter à l'écran d'accueil »");
  d.innerHTML = l.map(esc).join("<br>");
  d.classList.remove("hide");
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const fmtN = n => Math.round(n).toLocaleString("fr-FR").replace(/ | /g, " ");
const ROW = 64;
const LETTRES = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

/* ---------------- stockage local ---------------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem("babyname." + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("babyname." + k, JSON.stringify(v)); } catch(e){} }
};

/* ---------------- état ---------------- */
const etat = {
  mode: store.get("mode", "F"),          // F fille, M garçon, T les deux
  tri: "az", q: "", dans: "nom",
  orig: "", rel: "", minPop: 0, lmin: 0, lmax: 0, avecSens: false,
  vue: "noms",
  favGenre: "T",
  style: store.get("style", "gouts"),    // découvrir : gouts, tendance, classiques, rares
};
// goûts : { n, t, l } — l = 1 j'aime, 2 coup de cœur
let gouts = store.get("gouts", null);
if(!gouts){ gouts = store.get("favs", []).map(f => ({ n:f.n, t:f.t, l:1 })); store.set("gouts", gouts); }
let vus = new Set(store.get("vus", []));
let partenaire = store.get("partenaire", null);   // { nom, g:[{n,l}] }
let nomFamille = store.get("nomFamille", "");
let theme = store.get("theme", "auto");

/* ---------------- thème ---------------- */
const mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
function appliquerTheme(){
  const sombre = theme === "sombre" || (theme === "auto" && mq && mq.matches);
  document.documentElement.setAttribute("data-theme", sombre ? "sombre" : "clair");
  document.documentElement.setAttribute("data-mode", etat.mode);
  const m = document.querySelector('meta[name="theme-color"]');

function bitsRel(s){ let b = 0; for(const c of s || "") b |= 1 << "CJMHBY".indexOf(c); return b; }

function initDonnees(){
  D = window.BN_DATA;
  const n = D.n; N = n.length;
  K = new Array(N); LET = new Uint8Array(N); GP = new Uint8Array(N); LONG = new Uint8Array(N);
  POP = new Float64Array(N); TEND = new Float64Array(N); RELB = new Uint8Array(N);
  ORIG = new Int16Array(N).fill(-1);
  const orIdx = new Map(), orN = [];
  const getOr = nom => { if(!nom) return -1; let i = orIdx.get(nom); if(i === undefined){ i = orN.length; orIdx.set(nom, i); orN.push({nom, n:0}); } return i; };
  const racFam = D.rac.map(r => getOr(famille(r[2])));
  sensCle = D.rac.map(r => norm(r[3] + " " + r[5]));
  for(let i = 0; i < N; i++){
    const r = n[i], det = r[7] || {};
    const k = norm(r[0]);
    K[i] = k;
    const c = k.charCodeAt(0) - 97;
    LET[i] = c >= 0 && c < 26 ? c : 26;
    LONG[i] = Math.min(255, k.replace(/[^a-z]/g, "").length);
    GP[i] = r[1];
    POP[i] = r[2] + r[4] * 0.25;
    TEND[i] = r[3] + (r[3] ? 0 : r[4] * 0.0001);
    RELB[i] = bitsRel(det.l);
    parNom.set(r[0], i);
    const prev = parCle.get(k);
    if(prev === undefined || POP[i] > POP[prev]) parCle.set(k, i);
    let o = -1;
    if(typeof r[5] === "number" && r[5] >= 0) o = racFam[r[5]];
    else if(Array.isArray(r[5])) o = racFam[r[5][0]];
    else if(det.o != null) o = getOr(famille(D.orig[det.o]));
    ORIG[i] = o;
    if(o >= 0) orN[o].n++;
  }
  ORIGINES = orN.map((o, i) => ({...o, i})).sort((a, b) => b.n - a.n);
  ordres.az = Int32Array.from({length:N}, (_, i) => i);
}

function ordre(t){
  if(ordres[t]) return ordres[t];
  const a = Int32Array.from({length:N}, (_, i) => i);
  const sc = t === "pop" ? POP : TEND;
  a.sort((x, y) => sc[y] - sc[x] || (K[x] < K[y] ? -1 : 1));
  return ordres[t] = a;
}

function genreDe(i){ const g = GP[i]; return g >= 80 ? "F" : g <= 20 ? "M" : "X"; }
function dansMode(i, m){ return m === "T" || (m === "F" ? GP[i] >= 35 : GP[i] <= 65); }
function passeFiltres(i){
  if(etat.orig !== "" && ORIG[i] !== +etat.orig) return false;
  if(etat.rel){
    if(etat.rel === "N"){ if(RELB[i]) return false; }
    else if(!(RELB[i] & (1 << "CJMHBY".indexOf(etat.rel)))) return false;
  }
  if(etat.minPop && POP[i] < etat.minPop) return false;
  if(etat.lmin && LONG[i] < etat.lmin) return false;
  if(etat.lmax && LONG[i] > etat.lmax) return false;
  if(etat.avecSens && !aSens(i)) return false;
  return true;
}
function aSens(i){ const r = D.n[i]; return r[5] !== -1 || !!(r[7] && (r[7].m || r[7].e)); }

/* infos d'étymologie d'un prénom */
function infos(i){
  const r = D.n[i], det = r[7] || {};
  const ref = r[5], rel = r[6];
  const auto = det.s === "a", wikt = det.s === "w";
  if(Array.isArray(ref)){
    const parts = ref.map(j => D.rac[j]);
    return { rel:4, parts, auto, sens: parts.map(p => p[3]).join(" · "),
      orig: [...new Set(parts.map(p => famille(p[2])))].map((o, k) => k ? o.toLowerCase() : o).join(" et ") };
  }
  if(ref >= 0){
    const x = D.rac[ref];
    return { rel, rac:x, ri:ref, sens:x[3], orig:x[2], fete: rel <= 3 || rel === 5 ? x[4] : "", ety:x[5], note:det.e, auto, wikt };
  }
  const o = det.o != null ? D.orig[det.o] : "";
  return { rel:-1, orig:o, estime:!!det.x, ety:det.e, sens:det.m, wikt };
}
function tradsDe(i){ const s = (D.n[i][7] || {}).l || ""; return s.split("").map(c => TRAD[c]).filter(Boolean); }
function sousTitre(i){
  const inf = infos(i), r = D.n[i];
  const dr = drapeau(inf.orig);
  let t;
  if(inf.sens && inf.sens !== "—") t = esc(famille(inf.orig)) + (inf.orig ? " · " : "") + esc(inf.sens);
  else if(inf.orig === "Américaine" && inf.estime) t = "Prénom américain" + (r[4] ? " · " + fmtN(r[4]) + " naissances" : "");
  else if(inf.orig) t = "Origine " + esc(inf.orig.toLowerCase()) + (inf.estime ? " (estimée)" : "");
  else if(r[2]) t = fmtN(r[2]) + " naissance" + (r[2] > 1 ? "s" : "") + " en France";
  else if(r[4]) t = fmtN(r[4]) + " naissances aux États-Unis";
  else t = "Prénom rare";
  return dr + '<span>' + t + '</span>';
}

   ============================================================ */
let liste = new Int32Array(0);

function filtrer(){
  const q = norm(etat.q.trim());
  const base = ordre(etat.tri);
  const m = etat.mode, d = D.n;
  const ok = i => dansMode(i, m) && passeFiltres(i);
  const res = [];
  if(!q){
    for(let x = 0; x < base.length; x++){ const i = base[x]; if(ok(i)) res.push(i); }
  } else if(etat.dans === "sens"){
    const mots = q.split(/\s+/).filter(Boolean);
    for(let x = 0; x < base.length; x++){
      const i = base[x], ref = d[i][5], det = d[i][7] || {};
      let txt = "";
      if(Array.isArray(ref)) txt = ref.map(j => sensCle[j]).join(" ");
      else if(ref >= 0) txt = sensCle[ref];
      if(det.m) txt += " " + norm(det.m);
      if(!txt) continue;
      if(mots.every(w => txt.includes(w)) && ok(i)) res.push(i);
    }
  } else {
    const deb = [], dedans = [];
    for(let x = 0; x < base.length; x++){
      const i = base[x], k = K[i];
      if(k.startsWith(q)){ if(ok(i)) deb.push(i); }
      else if(q.length > 1 && k.includes(q)){ if(ok(i)) dedans.push(i); }
    }
    const ex = deb.filter(i => K[i] === q);
    res.push(...ex, ...deb.filter(i => K[i] !== q), ...dedans);
  }
  liste = Int32Array.from(res);
  premiereLettre = null;
  if(etat.tri === "az" && !q){
    premiereLettre = new Int32Array(27).fill(-1);
    for(let p = liste.length - 1; p >= 0; p--) premiereLettre[LET[liste[p]]] = p;
  }
}

function construireRail(){

function placerRail(){
  const r = $("#rail");
  r.style.top = (hauteurCollante() + 10) + "px";
  r.style.bottom = "calc(var(--tab) + 10px)";
}
let _railAct = -1;
function majRail(){
  const r = $("#rail");
  if(!railActif || etat.vue !== "noms" || $("#sheet").innerHTML || !$("#liste")){ r.classList.remove("on"); return; }
  const top = $("#liste").getBoundingClientRect().top;

function loupe(k){
  const sp = $("#rail").children;
  for(let j = 0; j < sp.length; j++){
    const d = Math.abs(j - k);
    const s = d === 0 ? 2.1 : d === 1 ? 1.55 : d === 2 ? 1.22 : 1;
    sp[j].style.transform = "scale(" + s + ")";
    sp[j].classList.toggle("act", d === 0);
  }
}
function allerLettre(k){
  if(!premiereLettre) return;
  let p = premiereLettre[k];
  if(p < 0){
    for(let j = k + 1; j < 27 && p < 0; j++) p = premiereLettre[j];
    if(p < 0) for(let j = k - 1; j >= 0 && p < 0; j--) p = premiereLettre[j];
  }
  if(p < 0) return;
  const y = $("#liste").getBoundingClientRect().top + scrollY + p * ROW - hauteurCollante();
  window.scrollTo(0, Math.ceil(y));
}
function initRail(){
  const r = $("#rail"), b = $("#bulle");
  let actif = false;
  const lettreA = y => { const rc = r.getBoundingClientRect(); return Math.max(0, Math.min(25, Math.floor((y - rc.top) / rc.height * 26))); };
  const suivre = e => {
    const k = lettreA(e.clientY);
    b.textContent = LETTRES[k];
    b.style.top = Math.max(r.getBoundingClientRect().top, Math.min(e.clientY - 33, innerHeight - 140)) + "px";
    b.classList.add("on");
    loupe(k); _railAct = k;
    allerLettre(k);
  };
  r.addEventListener("pointerdown", e => { actif = true; r.setPointerCapture(e.pointerId); suivre(e); e.preventDefault(); });
  r.addEventListener("pointermove", e => { if(actif) suivre(e); });
  const fin = () => { actif = false; setTimeout(() => b.classList.remove("on"), 350); };
  r.addEventListener("pointerup", fin);
  r.addEventListener("pointercancel", fin);
}

/* ---------------- le bébé qui pivote ----------------
   Les trois visages sont empilés au même endroit. Changer de choix fait
   tourner le visage courant sur son axe vertical jusqu'à la tranche, puis
   le suivant arrive de l'autre côté : rien ne quitte jamais le centre. */
const ORDRE_MODES = ["F", "M", "T"];
let _faceK = 0, _pivot = null;
function initPrisme(){
  const sc = $("#scene"), pr = $("#prisme");
  _faceK = ORDRE_MODES.indexOf(etat.mode);
  pr.querySelectorAll(".face").forEach(f => {
    const on = +f.dataset.k === _faceK;
    f.style.transition = "none"; f.style.transform = "rotateY(0deg)"; f.style.visibility = on ? "visible" : "hidden";
  });
  let x0 = null, bouge = false, dx = 0;
  const face = () => pr.querySelector('.face[data-k="' + _faceK + '"]');
  sc.addEventListener("pointerdown", e => { x0 = e.clientX; bouge = false; dx = 0; sc.setPointerCapture(e.pointerId); });
  sc.addEventListener("pointermove", e => {
    if(x0 == null) return;
    dx = e.clientX - x0;
    if(Math.abs(dx) > 6) bouge = true;
    if(bouge){ const f = face(); f.style.transition = "none"; f.style.transform = "rotateY(" + Math.max(-80, Math.min(80, dx * 0.6)) + "deg)"; }
  });
  const lacher = () => {
    if(x0 == null) return;
    x0 = null;
    if(!bouge) return pivoter(1);
    if(Math.abs(dx) > 30) return pivoter(dx < 0 ? 1 : -1);
    const f = face(); f.style.transition = "transform .3s cubic-bezier(.3,1.4,.5,1)"; f.style.transform = "rotateY(0deg)";
  };
  sc.addEventListener("pointerup", lacher);
  sc.addEventListener("pointercancel", lacher);
  sc.addEventListener("keydown", e => {
    if(e.key === "Enter" || e.key === " " || e.key === "ArrowRight"){ e.preventDefault(); pivoter(1); }
    if(e.key === "ArrowLeft"){ e.preventDefault(); pivoter(-1); }
  });
}
function pivoter(dir, versK){
  const pr = $("#prisme"); if(!pr) return;
  const k = versK !== undefined ? versK : (_faceK + dir + 3) % 3;
  if(k === _faceK){ const f = pr.querySelector('.face[data-k="' + k + '"]'); f.style.transition = "transform .3s"; f.style.transform = "rotateY(0deg)"; return; }
  const out = pr.querySelector('.face[data-k="' + _faceK + '"]'), inn = pr.querySelector('.face[data-k="' + k + '"]');
  clearTimeout(_pivot);
  pr.querySelectorAll(".face").forEach(f => { if(f !== out && f !== inn) f.style.visibility = "hidden"; });
  out.style.transition = "transform .18s ease-in";
  out.style.transform = "rotateY(" + (dir > 0 ? -90 : 90) + "deg)";
  _faceK = k;
  _pivot = setTimeout(() => {
    out.style.visibility = "hidden";
    inn.style.transition = "none";
    inn.style.transform = "rotateY(" + (dir > 0 ? 90 : -90) + "deg)";
    inn.style.visibility = "visible";
    void inn.offsetWidth;
    inn.style.transition = "transform .42s cubic-bezier(.2,1.35,.45,1)";
    inn.style.transform = "rotateY(0deg)";
  }, 180);
  choisirMode(ORDRE_MODES[k], false);
}
function choisirMode(m, tourner){
  if(tourner && $("#prisme")){
    const k = ORDRE_MODES.indexOf(m);
    if(k !== _faceK) pivoter(((k - _faceK + 3) % 3) === 1 ? 1 : -1, k);
  }
  if(m === etat.mode) return;
  etat.mode = m;
  store.set("mode", m);
  appliquerTheme();
  rafraichir(false);
  if(etat.vue === "favs") vueFavs();
  if(etat.vue === "dec") { file = []; vueDecouvrir(); }
}

function b64dec(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); while(s.length % 4) s += "="; return decodeURIComponent(escape(atob(s))); }

/* ============================================================
   Découvrir : les cartes à balayer
   ============================================================ */
let file = [];                  // prochaines cartes
let historique = [];            // pour annuler : { i, avant }
let _pool = null, _poolCle = "";
let _era = null;

function eraDe(i){
  if(!_era) _era = new Int16Array(N).fill(-1);
  if(_era[i] !== -1) return _era[i];
  const det = D.n[i][7] || {};
  let v = 0;
  if(det.f) v = medianeAnnee(det.f, 1900, 5) || 0;
  else if(det.u) v = medianeAnnee(det.u, 1880, 10) || 0;
  return _era[i] = v;
}
function pool(){
  const cle = etat.mode + etat.orig + etat.rel + etat.minPop + etat.lmin + etat.lmax + etat.avecSens + etat.style;
  if(_pool && _poolCle === cle) return _pool;
  const a = [];
  const seuil = etat.style === "rares" ? 30 : 150;
  for(let i = 0; i < N; i++){
    if(POP[i] < seuil) continue;
    if(etat.style === "rares" && POP[i] > 2500) continue;
    const nom = D.n[i][0];
    if(/[- ]/.test(nom)) continue;
    if(!dansMode(i, etat.mode) || !passeFiltres(i)) continue;
    if(etat.style === "rares" && !aSens(i)) continue;
    a.push(i);
  }
  _poolCle = cle;
  return _pool = a;
}
function terminaison(k, n){ return k.length > n ? k.slice(-n) : k; }
function phonCle(k){ return k.replace(/ph/g, "f").replace(/th/g, "t").replace(/y/g, "i").replace(/k/g, "c").replace(/h/g, "").replace(/(.)\1+/g, "$1"); }

function profil(){
  const p = { poids:0, rac:new Map(), orig:new Map(), t2:new Map(), t3:new Map(), ini:new Map(), era:[], rel:new Map(), pop:new Map(), long:0, phon:new Set() };
  for(const g of gouts){
    const i = parNom.get(g.n); if(i === undefined) continue;
    const w = g.l === 2 ? 2.5 : 1;
    const r = D.n[i], k = K[i];
    p.poids += w;
    const add = (m, key) => { if(key == null || key === -1 || key === "") return; m.set(key, (m.get(key) || 0) + w); };
    if(typeof r[5] === "number" && r[5] >= 0) add(p.rac, r[5]);
    add(p.orig, ORIG[i]);
    add(p.t2, terminaison(k, 2)); add(p.t3, terminaison(k, 3)); add(p.ini, k.charAt(0));
    for(let b = 0; b < 6; b++) if(RELB[i] & (1 << b)) add(p.rel, b);
    add(p.pop, Math.floor(Math.log10(POP[i] + 1)));
    const e = eraDe(i); if(e) p.era.push([e, w]);

function fete(s){
  if(!s) return "";

function syllabes(nom){

  let n = (k.match(/[aeiouy]+/g) || []).length;
  if(k.length > 3 && /[^aeiouy]e$/.test(k)) n--;
  if(/[^aeiouy]es$/.test(k) && k.length > 4) n--;
  return Math.max(1, n);
}

function courbe(serie, debut, pas, id){
  const W = 600, H = 150, pad = 18;
  const max = Math.max(...serie, 1), n = serie.length;
  const x = k => (k / (n - 1)) * W;
  const y = v => H - pad - (v / max) * (H - pad - 8);
  let d = "M0 " + y(serie[0]);
  for(let k = 1; k < n; k++){
    const x0 = x(k - 1), x1 = x(k), xm = (x0 + x1) / 2;
    d += " C" + xm + " " + y(serie[k - 1]) + " " + xm + " " + y(serie[k]) + " " + x1 + " " + y(serie[k]);
  }
  const aire = d + " L" + W + " " + (H - pad) + " L0 " + (H - pad) + " Z";
  const kmax = serie.indexOf(max);
  let axes = "";
  for(let k = 0; k < n; k++){ const a = debut + k * pas; if(a % (pas >= 10 ? 40 : 25) === 0) axes += '<text class="axe" x="' + x(k) + '" y="' + (H - 2) + '" text-anchor="' + (k === 0 ? "start" : k === n - 1 ? "end" : "middle") + '">' + a + '</text>'; }
  return '<div class="chart" data-id="' + id + '">' +

      '<line x1="0" x2="' + W + '" y1="' + (H - pad) + '" y2="' + (H - pad) + '" stroke="var(--trait)" stroke-width="1"/>' +
      '<path d="' + aire + '" fill="url(#g' + id + ')"/>' +
      '<path d="' + d + '" fill="none" stroke="var(--acc)" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
      '<circle cx="' + x(kmax) + '" cy="' + y(max) + '" r="4" fill="var(--acc)" vector-effect="non-scaling-stroke"/>' +
      '<line class="curseur" x1="0" x2="0" y1="0" y2="' + (H - pad) + '" stroke="var(--gris2)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" opacity="0"/>' +
      axes + '</svg><div class="tip"></div></div>';

function activerCourbe(el, serie, debut, pas, finA){
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cur = el.querySelector(".curseur");
  const n = serie.length;
  const montrer = e => {
    const rc = svg.getBoundingClientRect();
    const k = Math.round(Math.max(0, Math.min(1, (e.clientX - rc.left) / rc.width)) * (n - 1));
    const x = (k / (n - 1)) * 600;
    cur.setAttribute("x1", x); cur.setAttribute("x2", x); cur.setAttribute("opacity", "1");
    const a = debut + k * pas, b = Math.min(a + pas - 1, finA);
    tip.textContent = (a === b ? a : a + "–" + b) + " · " + fmtN(serie[k]) + " / an";
    tip.style.left = Math.max(60, Math.min(rc.width - 60, (k / (n - 1)) * rc.width)) + "px";
    tip.classList.add("on");
  };
  el.addEventListener("pointermove", montrer);
  el.addEventListener("pointerdown", montrer);
  el.addEventListener("pointerleave", () => { tip.classList.remove("on"); cur.setAttribute("opacity", "0"); });
}
function medianeAnnee(serie, debut, pas){
  const tot = serie.reduce((a, b) => a + b, 0);
  if(!tot) return null;
  let c = 0;
  for(let k = 0; k < serie.length; k++){ c += serie[k]; if(c >= tot / 2) return debut + k * pas + Math.floor(pas / 2); }
  return null;
}

const REL_TXT = {1:"Variante de", 2:"Graphie proche de", 3:"Forme dérivée de", 5:"Forme de", 6:"Formé sur"};
function boutonsFiche(nom){
  const l = niveau(nom);
  return '<button class="btn' + (l === 1 ? " pri" : "") + '" data-act="niv" data-l="1">' + ICO_COEUR + (l === 1 ? " J'aime" : " J'aime") + '</button>' +
    '<button class="btn' + (l === 2 ? " gold" : "") + '" data-act="niv" data-l="2">' + ICO_ETOILE + ' Coup de cœur</button>';
}
function ouvrirFiche(i, depuisHistorique){
  if(!depuisHistorique) history.pushState({ fiche:i }, "", "#" + encodeURIComponent(D.n[i][0]));
  rendreFiche(i);
}
function fermerFiche(){ $("#sheet").innerHTML = ""; document.body.style.overflow = ""; majRail(); }

function rendreFiche(i){
  const r = D.n[i], det = r[7] || {}, inf = infos(i), g = genreDe(i);
  const nom = r[0], gp = r[1];
  const lib = g === "F" ? "Fille" : g === "M" ? "Garçon" : "Mixte";
  const l = niveau(nom);
  const trads = tradsDe(i);
  let h = '<div class="sheet" id="fiche-sc" data-g="' + g + '"><div class="sheet-top">' +
    '<button class="iconbtn" data-act="retour" aria-label="Retour">' + ICO_RETOUR + '</button>' +
    '<div class="t" id="fiche-t">' + esc(nom) + '</div>' +
    '<button class="iconbtn coeur l' + l + '" id="fiche-fav-top" data-nom="' + esc(nom) + '" data-act="niv-cycle" aria-label="J\'aime / coup de cœur">' + iconeNiveau(l) + '</button>' +
    '<button class="iconbtn" data-act="partager-fiche" aria-label="Partager">' + ICO_PART + '</button>' +
  '</div><div class="sheet-in">';

  h += '<section class="fiche-h">' +
    '<div class="badges"><span class="badge ' + g + '">' + lib + (g === "X" ? " · " + gp + " % filles" : "") + '</span>' +
    (inf.orig ? '<span class="badge">' + drapeau(inf.orig) + esc(inf.orig) + (inf.estime ? " · estimée" : "") + '</span>' : "") +
    trads.map(t => '<span class="badge">' + t[2] + " " + t[1] + '</span>').join("") +
    (inf.fete ? '<span class="badge">Fête le ' + fete(inf.fete) + '</span>' : "") + '</div>' +
    '<h1 class="fiche-nom" id="fiche-nom">' + esc(nom) + '</h1>' +
    (nomFamille ? '<div class="fiche-complet">' + esc(nom + " " + nomFamille) + ' · initiales <span class="mono">' + initiales(nom) + '</span></div>' : "") +
    (inf.sens && inf.sens !== "—" ? '<div class="fiche-sens">' + esc(inf.sens) + '</div>' : "") +
    '<div class="fiche-bar"></div>' +
    '<div class="btns grow" id="fiche-btns" data-nom="' + esc(nom) + '">' + boutonsFiche(nom) + '</div>' +
  '</section>';

  const lettres = LONG[i];
  const num = numerologie(nom);
  const cel = (lb, v, d) => '<div class="cel"><div class="l">' + lb + '</div><div class="v">' + v + '</div>' + (d ? '<div class="d">' + d + '</div>' : "") + '</div>';
  h += '<div class="sect"><h2>En bref</h2></div><div class="grille">' +
    cel("Origine", inf.orig ? drapeau(inf.orig, true) + '<span>' + esc(famille(inf.orig)) + '</span>' : "Inconnue", inf.estime ? "d'après les pays où il est porté" : (inf.rel === 4 ? "prénom composé" : inf.wikt ? "d'après le Wiktionnaire" : "")) +
    cel("Tradition", trads.length ? '<span style="display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px">' + trads.map(t => '<span class="trad"><i>' + t[2] + '</i>' + t[1] + '</span>').join("") + '</span>' : "Aucune en particulier", trads.length ? (det.le ? "estimée d'après l'usage" : "d'après l'histoire du prénom") : "prénom profane") +
    cel("Fête", inf.fete ? fete(inf.fete) : "—", inf.fete ? "calendrier des saints" : "") +
    cel("Lettres", lettres, "initiale " + esc(nom.charAt(0).toUpperCase())) +
    cel("Syllabes", "≈ " + syllabes(nom), "à l'oral, en français") +
    cel("Numérologie", num, NUMERO[num]) +
    cel("Genre", lib, gp >= 50 ? gp + " % de filles" : (100 - gp) + " % de garçons") +
    cel("Initiales", '<span class="mono">' + initiales(nom) + '</span>', nomFamille ? "avec " + esc(nomFamille) : "ajoute ton nom dans Réglages") +
  '</div>';
  h += '<div class="genre-barre"><i style="width:' + gp + '%;background:var(--rose)"></i><i style="width:' + (100 - gp) + '%;background:var(--bleu)"></i></div>';

  // étymologie
  let ety = "";
  if(inf.rel === 4){
    ety += '<p class="texte">' + (inf.auto ? "Prénom formé de deux prénoms accolés : " : "Prénom composé de ") + inf.parts.map(p => '<b>' + esc(p[0]) + '</b>').join(" et ") + '.</p><div class="parts" style="margin-top:12px">' +
      inf.parts.map(p => {
        const j = indexRacine(p);
        return '<button class="part" ' + (j !== undefined ? 'data-ouvrir="' + j + '"' : "") + '><span class="av ' + p[1] + '">' + esc(p[0].charAt(0)) + '</span><span style="flex:1;min-width:0"><span class="pn">' + esc(p[0]) + '</span><br><span class="ps">' + drapeau(p[2]) + ' ' + esc(famille(p[2])) + ' · ' + esc(p[3]) + '</span></span></button>';
      }).join("") + '</div>';
    if(inf.auto) ety += '<div class="note">Décomposition établie automatiquement.</div>';
  } else if(inf.rac){
    const x = inf.rac;
    if(inf.rel === 6 && inf.note){
      ety += '<p class="texte">' + esc(inf.note) + '</p>';
      if(x[5]) ety += '<p class="texte" style="color:var(--gris)"><b style="color:var(--texte)">' + esc(x[0]) + '</b> : ' + esc(x[5]) + '</p>';
    } else if(x[5]) ety += '<p class="texte">' + esc(x[5]) + '</p>';
    if(inf.rel > 0){
      const j = indexRacine(x);
      ety += '<div class="note">' + REL_TXT[inf.rel] + ' <a data-ouvrir="' + (j !== undefined ? j : "") + '">' + esc(x[0]) + '</a>' +
        (inf.rel === 2 || inf.rel === 3 || inf.rel === 6 ? " — rapprochement établi automatiquement." : inf.rel === 5 ? " — d'après le Wiktionary." : ".") + '</div>';
    }
    if(x[6] >= 0 && D.rac[x[6]]){
      const j = indexRacine(D.rac[x[6]]);
      if(j !== undefined) ety += '<div class="note">Voir aussi <a data-ouvrir="' + j + '">' + esc(D.rac[x[6]][0]) + '</a>.</div>';
    }
  } else if(inf.ety){
    ety = '<p class="texte">' + esc(inf.ety) + '</p>' + (inf.wikt ? '<div class="note">Source : Wiktionnaire (CC BY-SA).</div>' : "");
  } else if(inf.estime && inf.orig){
    ety = '<p class="texte">Pas encore d\'étymologie détaillée pour ce prénom. D\'après les pays où il est porté, son origine est vraisemblablement <b>' + esc(inf.orig.toLowerCase()) + '</b>.</p>';
  } else {
    ety = '<p class="texte">Pas d\'étymologie connue pour ce prénom, souvent une création récente ou une graphie originale.</p>';
  }
  h += '<div class="sect"><h2>Origine et signification</h2></div>' + ety;

  const A = D.annee;
  if(det.f){
    const s = det.f, med = medianeAnnee(s, 1900, 5);
    const rec = s[s.length - 2] * 5 + s[s.length - 1], avant = s[s.length - 3] * 5;
    let tendance = "";
    if(avant + rec > 20){
      const pct = avant ? Math.round((rec / 6 - avant / 5) / (avant / 5) * 100) : 100;
      tendance = pct > 8 ? '<span class="tend up">↗ +' + pct + ' %</span>' : pct < -8 ? '<span class="tend down">↘ ' + pct + ' %</span>' : '<span class="tend">→ stable</span>';
    }
    const rg = det.r || [0, 0, 0, 0];
    const ord = n => n + (n === 1 ? "<sup>er</sup>" : "<sup>e</sup>");
    const fille = rg[0] && (gp >= 50 || !rg[2]);
    const rangTxt = fille ? ord(rg[0]) : rg[2] ? ord(rg[2]) : "—";
    const rangD = fille ? "chez les filles" : rg[2] ? "chez les garçons" : "hors classement";
    h += '<div class="sect"><h2>En France</h2><span class="sp"></span>' + tendance + '</div>' +
      '<div class="kpis">' +
        '<div class="kpi"><div class="l">Rang ' + A + '</div><div class="v num">' + rangTxt + '</div><div class="d">' + rangD + '</div></div>' +
        '<div class="kpi"><div class="l">Naissances ' + A + '</div><div class="v num">' + fmtN((rg[1] || 0) + (rg[3] || 0)) + '</div><div class="d">bébés</div></div>' +
        '<div class="kpi"><div class="l">Depuis 1900</div><div class="v num">' + fmtN(r[2]) + '</div><div class="d">porteurs</div></div>' +
      '</div>' + courbe(s, 1900, 5, "fr") +
      '<p class="texte" style="font-size:13px;color:var(--gris);margin-top:10px">Année record : <b style="color:var(--texte)">' + det.p[0] + '</b> avec ' + fmtN(det.p[1]) + ' naissances.' +
      (med ? ' La moitié des porteurs sont nés avant ' + med + ' environ.' : "") + '</p>';
  } else if(r[2]){
    h += '<div class="sect"><h2>En France</h2></div><p class="texte">Prénom rare : <b>' + fmtN(r[2]) + '</b> naissance' + (r[2] > 1 ? "s" : "") + ' recensée' + (r[2] > 1 ? "s" : "") + (det.y ? ' entre ' + det.y[0] + ' et ' + det.y[1] : "") + '.</p>';
  } else {
    h += '<div class="sect"><h2>En France</h2></div><p class="texte" style="color:var(--gris)">Aucune naissance recensée par l\'INSEE (moins de 3 par an).</p>';
  }
  if(det.u){
    h += '<div class="sect"><h2>Aux États-Unis</h2><span class="sp"></span><span class="cnt">depuis 1880</span></div>' +
      '<div class="kpis">' +
        '<div class="kpi"><div class="l">Naissances</div><div class="v num">' + fmtN(r[4]) + '</div><div class="d">1880–' + D.usMax + '</div></div>' +
        '<div class="kpi"><div class="l">Année record</div><div class="v num">' + det.q[0] + '</div><div class="d">' + fmtN(det.q[1]) + ' bébés</div></div>' +
        '<div class="kpi"><div class="l">Génération</div><div class="v num">' + (Math.floor((medianeAnnee(det.u, 1880, 10) || det.q[0]) / 10) * 10) + 's</div><div class="d">moitié née avant</div></div>' +
      '</div>' + courbe(det.u, 1880, 10, "us");
  } else if(r[4]){
    h += '<div class="sect"><h2>Aux États-Unis</h2></div><p class="texte">' + fmtN(r[4]) + ' naissances depuis 1880.</p>';
  }
  if(det.c && det.c.length){
    h += '<div class="sect"><h2>Porté aussi en</h2><span class="sp"></span><span class="cnt">par fréquence</span></div><div class="pays">' +
      det.c.map((c, k) => '<span><i style="width:' + Math.max(6, 26 - k * 2.2) + 'px"></i>' + esc(D.pays[c]) + '</span>').join("") + '</div>';
  }
  const pr = prochesDe(i);
  if(pr.length){
    const cg = carteGouts();
    h += '<div class="sect"><h2>Variantes et prénoms proches</h2><span class="sp"></span><span class="cnt">' + fmtN(pr.length) + '</span></div><div class="wrapchips">' +
      pr.slice(0, 48).map(j => { const lj = cg.get(D.n[j][0]); return '<button class="chip lien" data-ouvrir="' + j + '"><span style="width:7px;height:7px;border-radius:50%;background:var(--' + ({F:"rose",M:"bleu",X:"violet"})[genreDe(j)] + ')"></span>' + esc(D.n[j][0]) + (lj === 2 ? ' <span style="color:var(--or)">★</span>' : lj === 1 ? ' <span style="color:var(--rose)">♥</span>' : "") + '</button>'; }).join("") + '</div>';
  }
  h += '<p class="src">Sources : INSEE, fichier des prénoms (France, 1900–' + A + ') ; Social Security Administration (États-Unis) ; firstname-database ; Wiktionnaire et Wiktionary (CC BY-SA). Les rapprochements automatiques, les origines et traditions « estimées » sont signalés comme tels. La tradition religieuse indique l\'histoire du prénom, pas une appartenance.</p>';
  h += '</div></div>';

  const sh = $("#sheet");
  sh.innerHTML = h;
  document.body.style.overflow = "hidden";
  majRail();
  const sc = $("#fiche-sc");
  sc.scrollTop = 0;
  sc.addEventListener("scroll", () => { $("#fiche-t").classList.toggle("on", $("#fiche-nom").getBoundingClientRect().bottom < 60); });
  sc.addEventListener("click", e => { const o = e.target.closest("[data-ouvrir]"); if(o && o.dataset.ouvrir !== "") ouvrirFiche(+o.dataset.ouvrir); });
  sc.querySelectorAll(".chart").forEach(el => {
    if(el.dataset.id === "fr") activerCourbe(el, det.f, 1900, 5, A);
    if(el.dataset.id === "us") activerCourbe(el, det.u, 1880, 10, D.usMax);
  });
  sh.dataset.i = i;
}

function allerVue(v){
  if(!D) return;
  if(v === etat.vue){ if(v === "noms") window.scrollTo({ top:0, behavior:"smooth" }); return; }
  defil[etat.vue] = scrollY;
  etat.vue = v;
  ["noms", "dec", "favs", "plus"].forEach(x => $("#v-" + x).classList.toggle("hide", x !== v));
  if(v === "favs") vueFavs();
  if(v === "plus") vuePlus();
  if(v === "dec") vueDecouvrir();
  majTabs();
  window.scrollTo(0, v === "dec" ? 0 : defil[v] || 0);
  if(v === "noms"){ _fenDeb = -1; dessinerFenetre(); } else majRail();
}

function auHasard(){
  if(!D) return;
  for(let x = 0; x < 6000; x++){
    const i = Math.floor(Math.random() * N);
    if(dansMode(i, etat.mode) && POP[i] >= 500 && D.n[i][5] !== -1) return ouvrirFiche(i);
  }
}
function ouvrirJournal(){
  $("#modal").innerHTML = '<div class="mdl-bg" data-act="fermer-modal"><div class="mdl"><h3>Nouveautés</h3><div class="sous">Baby Name ' + VERSION + '</div>' +
    JOURNAL.map(j => '<div style="border-top:1px solid var(--trait2);padding:12px 0"><div style="display:flex;gap:9px;align-items:baseline"><span class="mono" style="font-size:12.5px;font-weight:500">' + j.v + '</span><span class="mono" style="font-size:10.5px;color:var(--gris2)">' + j.d + '</span><span style="font-size:13px;color:var(--gris);margin-left:auto">' + esc(j.t) + '</span></div><ul style="margin:7px 0 0;padding-left:17px">' +
      j.l.map(l => '<li style="font-size:13px;line-height:1.55;margin-bottom:3px;color:var(--gris)">' + esc(l) + '</li>').join("") + '</ul></div>').join("") +
    '<div class="btns"><button class="btn wide" data-act="fermer-modal-btn">Fermer</button></div></div></div>';
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-vue]");
  if(!t) return;
  if(t.dataset.vue){ allerVue(t.dataset.vue); return; }
  const a = t.dataset.act;
  if(a === "fermer-modal"){ if(e.target === t) $("#modal").innerHTML = ""; return; }
  if(a === "fermer-modal-btn"){ $("#modal").innerHTML = ""; return; }
  if(a === "theme"){
    const sombre = document.documentElement.getAttribute("data-theme") === "sombre";
    theme = sombre ? "clair" : "sombre"; store.set("theme", theme); appliquerTheme(); if(etat.vue === "plus") vuePlus(); return;
  }
  if(a === "journal") return ouvrirJournal();
  if(a === "installer") return installer();
  if(a === "diag-install") return diagnostic();
  if(a === "hasard") return auHasard();
  if(a === "filtres") return ouvrirFiltres();
  if(a === "filtres-ok") return appliquerFiltres();
  if(a === "filtres-raz"){ etat.orig = ""; etat.rel = ""; etat.minPop = 0; etat.lmin = 0; etat.lmax = 0; etat.avecSens = false; $("#modal").innerHTML = ""; apresFiltres(); return; }
  if(a === "retour") return history.back();
  if(a === "niv"){ const nom = $("#fiche-btns").dataset.nom, l = +t.dataset.l; fixerNiveau(nom, niveau(nom) === l ? 0 : l); return; }
  if(a === "niv-cycle"){ const i = parNom.get(t.dataset.nom); if(i !== undefined) cyclerNiveau(i); return; }
  if(a === "partager-fiche"){
    const i = +$("#sheet").dataset.i, inf = infos(i), nom = D.n[i][0];
    partager(nom, nom + (nomFamille ? " " + nomFamille : "") + (inf.sens ? " — " + inf.sens : "") + (inf.orig ? " (" + inf.orig + ")" : ""), location.href.split("#")[0] + "#" + encodeURIComponent(nom));
    return;
  }
  if(a === "partager-favs") return partager("Nos prénoms préférés", texteFavs());
  if(a === "copier-favs") return gouts.length ? copier(texteFavs()) : toast("Ta liste est vide pour l'instant");
  if(a === "duo") return ouvrirDuo();
  if(a === "duo-envoyer"){
    const p = $("#duo-p").value.trim(); store.set("monPrenom", p);
    $("#modal").innerHTML = "";
    partager("Nos prénoms — mode duo", (p ? p + " t'envoie" : "Voici") + " ses prénoms préférés sur Baby Name. Ouvre le lien pour voir vos matchs 💞", lienDuo(p));
    return;
  }
  if(a === "duo-oublier"){ partenaire = null; store.set("partenaire", null); vueFavs(); return; }
  if(a === "vider-vus"){ vus = new Set(); store.set("vus", []); file = []; toast("Les prénoms passés reviennent dans Découvrir"); vuePlus(); return; }
  if(a === "vider-favs"){
    const avant = gouts.slice(); gouts = []; store.set("gouts", gouts); apresGouts(); vuePlus();
    toast("Liste effacée", { label:"Annuler", fn(){ gouts = avant; store.set("gouts", gouts); apresGouts(); vuePlus(); } });
    return;
  }
  if(a === "dec-oui") return choisirCarte(1);
  if(a === "dec-non") return choisirCarte(0);
  if(a === "dec-cdc") return choisirCarte(2);
  if(a === "dec-annuler") return annulerCarte();
  if(a === "dec-info"){ if(file.length) ouvrirFiche(file[0]); return; }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    if($("#modal").innerHTML) $("#modal").innerHTML = "";
    else if($("#sheet").innerHTML) history.back();
    return;
  }
  if(etat.vue === "dec" && !$("#sheet").innerHTML && !$("#modal").innerHTML && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    if(e.key === "ArrowRight"){ e.preventDefault(); choisirCarte(1); }
    if(e.key === "ArrowLeft"){ e.preventDefault(); choisirCarte(0); }
    if(e.key === "ArrowUp"){ e.preventDefault(); choisirCarte(2); }
    if(e.key === "Backspace"){ e.preventDefault(); annulerCarte(); }
  }
});

window.addEventListener("popstate", e => {
  const s = e.state;
  if(s && s.fiche !== undefined && D) rendreFiche(s.fiche);
  else fermerFiche();
});
let _raf = 0;
window.addEventListener("scroll", () => {
  if(_raf) return;
  _raf = requestAnimationFrame(() => { _raf = 0; dessinerFenetre(); });
}, { passive:true });
window.addEventListener("resize", () => { majOutilsTop(); placerRail(); _fenDeb = -1; dessinerFenetre(); });

function demarrer(){
  if("scrollRestoration" in history) history.scrollRestoration = "manual";
  vueNoms();
  majOutilsTop();
  initRail();
  majTabs();
  const h = location.hash.slice(1);
  history.replaceState({}, "", location.pathname + location.search);
  if(h.startsWith("duo=")) importerDuo(h.slice(4));
  else { const n = decodeURIComponent(h); if(n && parNom.has(n)) ouvrirFiche(parNom.get(n)); }
}

$("#ver-chip").textContent = "v" + VERSION;
majTabs();
chargerDonnees();
</script>
</body>
</html>
